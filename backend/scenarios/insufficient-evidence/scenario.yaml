# Insufficient-evidence scenario stub (ADR 0032): sparse notes with no time
# anchors or corroborating evidence should produce a refusal/no-hypothesis result.
id: insufficient-evidence
title: Insufficient evidence for confident postmortem
severity: sev3
status: open
summary: >-
  Sparse incident notes mention customer impact but do not establish a timeline,
  root cause, or remediation path.

ambiguity_notes: >-
  Evidence is too sparse and lacks time anchors. Expected behavior is refusal:
  do not produce confident RCA hypotheses without support.
evaluation_tags: [insufficient-evidence, refusal, no-time-anchors]
expected_hypothesis_families: []

# Causal Evaluation Expectations for a refusal scenario (PRD #38, ADR 0044): the
# honest outcome is to refuse, so no causal factors are expected. The
# causal-refusal and causal-role-constraints checks assert the run does not
# manufacture a confident conclusion from sparse evidence.
causal_evaluation:
  expected_refusal: true
  expected_factors: []
  unacceptable_overclaims:
    - the root cause was identified
    - the incident was caused by

ground_truth_postmortem: ground_truth_postmortem.md

evidence:
  - source_type: incident_notes
    source_name: sparse-notes.md
    path: evidence/sparse-notes.md

replay:
  rca: replay/rca.json
